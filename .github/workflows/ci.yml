name: checks

# The static checks that need no model, no download and no GPU: script syntax,
# the prompt/profile/evidence consistency the offline gate already proves, and
# every relative link. The measurement scripts themselves need a local model and
# a free GPU, so they are run by hand on the host and their outputs are
# committed under evidence/ and reference/.
#
# Manual only (workflow_dispatch) — a benchmark repository's numbers come from a
# specific machine, so nothing here pretends CI can reproduce them. This runs
# the same `./test/test.sh` and the same `scripts/lint.sh` a contributor runs
# locally, at pinned versions, so a green local run and a green CI run are the
# same bytes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: The offline gate
        run: ./test/test.sh

  lint:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@v5
      - name: Install the native linters
        run: brew install shellcheck actionlint
      - name: Run every linter
        run: ./scripts/lint.sh
